name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  recommend:
    name: Cursor recommendations
    needs: analyze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: read

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit npm workspaces (do not fail on findings)
        run: |
          mkdir -p logs
          set +e
          npm audit --workspaces --include-workspace-root --json > logs/npm-audit.json
          status=$?
          set -e
          echo "npm audit exit code: ${status}"
          if [ ! -s logs/npm-audit.json ]; then
            echo '{"error":"npm audit produced no JSON"}' > logs/npm-audit.json
          fi

      - name: Ask Cursor for recommendations and comment on the PR
        continue-on-error: true
        env:
          CURSOR_TO_GIT_API_KEY: ${{ secrets.CURSOR_TO_GIT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NPM_AUDIT_PATH: logs/npm-audit.json
        run: npx tsx scripts/pr-audit-agent.ts
