name: Security check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  npm-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit npm workspaces (do not fail on moderate findings)
        run: |
          mkdir -p logs
          set +e
          npm audit --workspaces --include-workspace-root --json > logs/npm-audit.json
          status=$?
          set -e
          echo "npm audit exit code: ${status}"
          if [ ! -s logs/npm-audit.json ]; then
            echo '{"error":"npm audit produced no JSON"}' > logs/npm-audit.json
          fi

      - name: Ask Cursor agent for suggestions
        continue-on-error: true
        env:
          CURSOR_TO_GIT_API_KEY: ${{ secrets.CURSOR_TO_GIT_API_KEY }}
        run: npx tsx scripts/pr-audit-agent.ts

      - name: Commit logs to the PR branch
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/npm-audit.json logs/npm-audit-suggestions.md logs/README.md
          if git diff --cached --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "chore: store npm audit Cursor suggestions"
          git push
