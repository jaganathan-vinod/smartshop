name: Security check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm ci

      - name: Audit npm workspaces (do not fail on moderate findings)
        run: |
          mkdir -p logs
          set +e
          npm audit --workspaces --include-workspace-root --json > logs/npm-audit.json
          status=$?
          set -e
          echo "npm audit exit code: ${status}"
          if [ ! -s logs/npm-audit.json ]; then
            echo '{"error":"npm audit produced no JSON"}' > logs/npm-audit.json
          fi

      - name: Ask Cursor agent for suggestions
        continue-on-error: true
        env:
          CURSOR_TO_GIT_API_KEY: ${{ secrets.CURSOR_TO_GIT_API_KEY }}
        run: npx tsx scripts/pr-audit-agent.ts

      - name: Upload audit artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-cursor-suggestions
          path: |
            logs/npm-audit.json
            logs/npm-audit-suggestions.md
          if-no-files-found: warn

      - name: Comment audit JSON and suggestions on the PR
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          suggestions="logs/npm-audit-suggestions.md"
          audit="logs/npm-audit.json"
          if [ ! -f "$suggestions" ]; then
            echo "Cursor agent did not write logs/npm-audit-suggestions.md." > "$suggestions"
          fi
          {
            echo "## npm audit + Cursor suggestions"
            echo
            echo "Full files are also on this run as artifact \`npm-audit-cursor-suggestions\`."
            echo
            cat "$suggestions"
            echo
            echo "<details><summary>npm audit JSON</summary>"
            echo
            echo '```json'
            size=$(wc -c < "$audit")
            if [ "$size" -gt 50000 ]; then
              head -c 50000 "$audit"
              echo
              echo "… truncated; see the workflow artifact for the full JSON."
            else
              cat "$audit"
            fi
            echo '```'
            echo
            echo "</details>"
          } > /tmp/pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/pr-comment.md
